<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="light dark" />
<meta name="theme-color" content="#111913" />
<title>PetrovBit — indie games for pocket screens</title>
<meta name="description" content="PetrovBit — independent one-person game studio. Pixel-perfect, offline-first arcade games for mobile: Tank 1990 Big Map Battle, Pixel Tanks Steel Frontier, Swamp Defense." />
<meta property="og:title" content="PetrovBit — indie games for pocket screens" />
<meta property="og:description" content="One dev. Three games. Zero marketing. Pixel-perfect, offline-first mobile arcades." />
<meta property="og:type" content="website" />
<script src="v2/metrika.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700;900&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="v2/shared.css" />

<script>
  /* Тема и язык до первого кадра, иначе мигает чужой темой.
     "auto" не хранится: отсутствие ключа и есть auto, дальше решает
     prefers-color-scheme в shared.css. */
  (function () {
    var root = document.documentElement;
    try {
      var T = localStorage.getItem("pb-theme");
      if (T === "light" || T === "dark") root.setAttribute("data-theme", T);
      var L = localStorage.getItem("pb-lang");
      if (L === "ru" || L === "en") root.setAttribute("lang", L);
    } catch (e) {}
  })();
</script>

<style>
  html, body { margin: 0; background: var(--v2-paper); min-height: 100%; }
  body { -webkit-font-smoothing: antialiased; }
  #root { min-height: 100vh; }
  html { scroll-behavior: smooth; }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<!-- Пиксельный шрифт из Tank 1990 — обычный script, без babel: это просто данные. -->
<script src="v2/brickfont.js"></script>

<script type="text/babel" data-presets="react" src="v2/shared.jsx"></script>
<script type="text/babel" data-presets="react" src="v2/bricktext.jsx"></script>
<script type="text/babel" data-presets="react" src="v2/suggest.jsx"></script>
<script type="text/babel" data-presets="react" src="v2/quiet.jsx"></script>

<script type="text/babel" data-presets="react">
/* Default language follows the <html lang> attribute set by the boot script. */
function Site() {
  const initialLang = document.documentElement.getAttribute("lang") === "en" ? "en" : "ru";
  const [lang, setLangState] = React.useState(initialLang);
  const [bp, setBp] = React.useState(() => pickBp(window.innerWidth));

  function pickBp(w) { return w < 640 ? "mobile" : w < 1024 ? "tablet" : "desktop"; }

  React.useEffect(() => {
    let raf = 0;
    const onResize = () => {
      cancelAnimationFrame(raf);
      raf = requestAnimationFrame(() => setBp(pickBp(window.innerWidth)));
    };
    window.addEventListener("resize", onResize, { passive: true });
    return () => { window.removeEventListener("resize", onResize); cancelAnimationFrame(raf); };
  }, []);

  const setLang = (v) => {
    setLangState(v);
    document.documentElement.setAttribute("lang", v);
    try { localStorage.setItem("pb-lang", v); } catch (e) {}
  };

  return (
    <PageQuiet
      lang={lang}
      setLang={setLang}
      mobile={bp === "mobile"}
      tablet={bp === "tablet"}
    />
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<Site />);
</script>
</body>
</html>
